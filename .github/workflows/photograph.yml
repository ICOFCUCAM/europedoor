name: photograph

# ACQUIRING A PHOTOGRAPH IS A STEP SOMEBODY DISPATCHES, NOT PART OF THE BUILD.
#
# The build must run on a machine with no internet and produce identical
# pages, which is why the map data is committed rather than fetched. The same
# rule applies here: this workflow fetches, derives, registers and OPENS A
# PULL REQUEST, and the build never reaches the network.
#
# TWO STAGES, BECAUSE THEY ARE TWO DECISIONS.
#
#   discover  searches, prints candidate IDs, and DRAWS EACH ONE INSIDE THE
#             REAL HERO — one image, uploaded as an artifact, for a person to
#             art-direct from. It commits nothing and it names no winner.
#   acquire   takes ONE approved id and does everything after it: fetch by
#             id, verify the returned id is the requested id, download,
#             hash, keep the original, build the ladder, complete the
#             provenance, run every gate, shoot the finished page, open a PR.
#
# THE PHASE THE FIRST VERSION HAD NO STEP FOR IS ART DIRECTION.
#
#   discover -> contact sheet -> A PERSON LOOKS -> exact photo id ->
#   automated acquisition -> PR carrying the rendered page -> a person looks
#   again -> merge
#
# A list of ids, photographers and pixel sizes cannot answer the only
# question that matters here: does this photograph work through an elliptical
# arch, under a cobalt masthead, with a 60px serif headline over its lower
# half, on a limestone wall. A photograph can be beautiful and be wrong for
# that composition, and the reverse — and neither is visible in a provider's
# grid of rectangles. The sheet renders the actual homepage per candidate.
#
# THE HUMAN DECISION IS WHICH PHOTOGRAPH. Nothing here picks one. The previous
# design took a search result BY POSITION — "--pick 3" — so the picture a
# person approved and the picture that arrived could differ silently while
# every provenance field was correctly recorded about the wrong one.
#
# THE KEY IS A REPOSITORY SECRET AND IS PASSED AS `env` ON THE STEPS THAT NEED
# IT, never on a command line that gets logged, never into the register, never
# into the PR body. scripts/images/acquire.py does not print it and
# tools/checks.py greps the committed files for credential-shaped tokens.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "discover (search and list) or acquire (take one id)"
        required: true
        type: choice
        options: [discover, acquire]
        default: discover
      provider:
        description: "the acquisition provider — only ones the licence gate clears"
        required: true
        type: choice
        options: [pexels]
        default: pexels
      purpose:
        description: "why this photograph exists, e.g. homepage-hero (data/image-purposes.json)"
        required: true
        type: string
      query:
        description: "discover only: what to search for"
        required: false
        type: string
      photo_id:
        description: "acquire only: the EXACT provider photo id you approved"
        required: false
        type: string
      alt:
        description: "acquire only: what the photograph shows, for somebody who cannot see it"
        required: false
        type: string
      focal:
        description: "acquire only: focal point as x,y percentages"
        required: false
        default: "50,50"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    if: ${{ inputs.stage == 'discover' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # WHICH SECRETS CAN THIS WORKFLOW ACTUALLY SEE?
      #
      # Run #3 failed with "PEXELS_API_KEY is not set" one hour after the key
      # was added, and the log showed GitHub had substituted an empty string:
      # `PEXELS_API_KEY:` with nothing after it. The refusal was correct and
      # it could not say WHY, because a workflow cannot tell a misspelled
      # secret from an absent one — both arrive as "".
      #
      # This prints the NAMES only, never a value: it reads them out of an
      # env var rather than interpolating into the script, so nothing about
      # any secret reaches the log but the fact that it exists. A name that
      # is missing here is a name that was saved somewhere else — under
      # Variables rather than Secrets, on an Environment rather than the
      # repository, on another repository, or spelled differently.
      - name: Which secret names are visible here
        env:
          NAMES: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'EOF'
          import json, os
          names = sorted(json.loads(os.environ["NAMES"]))
          print("secrets this workflow can see:", ", ".join(names) or "(none)")
          if "PEXELS_API_KEY" not in names:
              print()
              print("PEXELS_API_KEY IS NOT AMONG THEM. It has to be a")
              print("REPOSITORY secret on this repository, under")
              print("Settings -> Secrets and variables -> Actions ->")
              print("Repository secrets, named exactly PEXELS_API_KEY.")
              print("A Variable is a different tab and an Environment")
              print("secret is a different scope; neither reaches this.")
          EOF

      - name: Search and list candidates
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/images/discover.py \
            --provider "${{ inputs.provider }}" \
            --purpose "${{ inputs.purpose }}" \
            --query "${{ inputs.query }}" \
            --manifest /tmp/candidates.json

      # THE SHEET IS THE POINT OF THIS STAGE, so it is not optional and it is
      # not a second dispatch. Discovery that ends at a list of ids hands the
      # art direction back to a provider's thumbnail grid, which is a
      # different composition than this site's.
      - name: Draw every candidate inside the real hero
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          # No Pillow here on purpose. The sheet re-encodes nothing: it fetches
          # one preview per candidate and hands it to the browser, and the
          # build it needs is the ordinary stdlib one. Installing an image
          # library for a step that does not decode an image is how a
          # dependency arrives without a reason.
          python3 tools/build.py
          python3 scripts/images/contact_sheet.py --manifest /tmp/candidates.json
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium
          # The suites launch the sandbox's own Chromium by path; a runner
          # has none, so the sheet takes the one Playwright just installed.
          HERO_SHEET_EXE="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          export HERO_SHEET_EXE
          node tools/hero-sheet.js /tmp/hero-sheet.png
          node tools/hero-sheet.js /tmp/hero-sheet-phone.png --phone
          node tools/hero-sheet.js /tmp/hero-sheet-dark.png --dark

      # NEVER A COMMIT. These are somebody else's photographs with no register
      # row, no hash and no date — the exact thing the licence gate refuses —
      # so they leave as an artifact of the run and the repository never sees
      # one. checks.py asserts that from the other end.
      - name: Upload the contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: hero-contact-sheet
          path: |
            /tmp/hero-sheet.png
            /tmp/hero-sheet-phone.png
            /tmp/hero-sheet-dark.png
            /tmp/candidates.json
          retention-days: 14

      - name: What to do with it
        run: |
          echo "Download the artifact and LOOK at the three sheets."
          echo "Nothing was chosen for you: the order is the provider's"
          echo "search order and position on the sheet means nothing."
          echo "Then run this workflow again with stage=acquire and the id."

  acquire:
    if: ${{ inputs.stage == 'acquire' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The dataset has to be valid before anything is added to it. The
      # LICENCE gate is not here — it lives inside acquire.py, which refuses
      # before it opens a socket, because that is the only place that can
      # refuse per provider AND per route. A step here that merely ran the
      # checks would look like a gate and gate nothing.
      - name: Validate the dataset
        run: python3 tools/build.py check

      - name: Refuse a dispatch that is missing what acquisition needs
        run: |
          set -euo pipefail
          test -n "${{ inputs.photo_id }}" || { echo "photo_id is required for acquire"; exit 1; }
          test -n "${{ inputs.alt }}"      || { echo "alt is required for acquire"; exit 1; }

      - name: Acquire the approved photograph
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/images/acquire.py \
            --provider "${{ inputs.provider }}" \
            --photo-id "${{ inputs.photo_id }}" \
            --purpose "${{ inputs.purpose }}" \
            --alt "${{ inputs.alt }}" \
            --focal "${{ inputs.focal }}"

      - name: Build the width ladder and complete the provenance
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow pillow-avif-plugin
          python3 scripts/images/derive.py "${{ inputs.purpose }}"

      - name: Rebuild and run every gate
        run: |
          set -euo pipefail
          python3 tools/build.py check
          python3 tools/build.py
          python3 tools/checks.py
          python3 tools/section-audit.py --check
          python3 tools/ux-audit.py --check
          python3 tools/invariants.py --check

      - name: Browser and design gates
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium
          node tools/browser-checks.js

      # THE SECOND LOOK, and it is the one that catches a page whose every
      # count is right. It shoots the built homepage at both widths and fails
      # on any request the page made that came back 4xx — which is exactly
      # how the derivatives were once registered, referenced and absent, with
      # the hero rendering as a hole and every gate green.
      - name: Shoot the finished page for review
        run: |
          set -euo pipefail
          HERO_SHEET_EXE="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          export HERO_SHEET_EXE
          node tools/hero-shot.js /tmp/hero-shot

      - name: Upload the rendered page
        uses: actions/upload-artifact@v4
        with:
          name: hero-shot
          path: |
            /tmp/hero-shot-wide.png
            /tmp/hero-shot-phone.png
          retention-days: 30

      - name: Refuse to commit anything credential-shaped
        run: python3 tools/photo-tests.py --committed-only

      - name: Commit and push a branch
        id: push
        run: |
          set -euo pipefail
          git config user.name "europedoor-photographs"
          git config user.email "noreply@europedoor.com"
          BRANCH="photo/${{ inputs.purpose }}-${{ inputs.photo_id }}"
          git checkout -b "$BRANCH"
          git add assets/img data/images.json docs site
          git commit -m "Photograph: ${{ inputs.purpose }} (${{ inputs.provider }} ${{ inputs.photo_id }})" \
                     -m "Acquired by GitHub Actions from an approved photo id. safety.img_tags leaves zero."
          git push -u origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # THE PR IS THE APPROVAL BOUNDARY, so it carries the evidence rather
      # than a file listing. Every figure below is read out of the register
      # the acquisition wrote — none of it is typed here, so the PR cannot
      # describe a photograph other than the one committed.
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/images/pr_body.py \
            --purpose "${{ inputs.purpose }}" \
            --branch "${{ steps.push.outputs.branch }}" > /tmp/pr-body.md
          gh pr create \
            --title "Photograph: ${{ inputs.purpose }} (${{ inputs.provider }} ${{ inputs.photo_id }})" \
            --body-file /tmp/pr-body.md \
            --head "${{ steps.push.outputs.branch }}" \
            --base "${{ github.ref_name }}"
