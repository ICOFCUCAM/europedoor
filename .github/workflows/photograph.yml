name: photograph

# ACQUIRING A PHOTOGRAPH IS A STEP SOMEBODY DISPATCHES, NOT PART OF THE BUILD.
#
# The build must run on a machine with no internet and produce identical
# pages, which is why the map data is committed rather than fetched. The same
# rule applies here: this workflow fetches, derives, registers and OPENS A
# PULL REQUEST, and the build never reaches the network.
#
# TWO STAGES, BECAUSE THEY ARE TWO DECISIONS.
#
#   discover  searches, prints candidate IDs, and DRAWS EACH ONE INSIDE THE
#             REAL HERO — one image, uploaded as an artifact, for a person to
#             art-direct from. It commits nothing and it names no winner.
#   acquire   takes ONE approved id and does everything after it: fetch by
#             id, verify the returned id is the requested id, download,
#             hash, keep the original, build the ladder, complete the
#             provenance, run every gate, shoot the finished page, open a PR.
#
# THE PHASE THE FIRST VERSION HAD NO STEP FOR IS ART DIRECTION.
#
#   discover -> contact sheet -> A PERSON LOOKS -> exact photo id ->
#   automated acquisition -> PR carrying the rendered page -> a person looks
#   again -> merge
#
# A list of ids, photographers and pixel sizes cannot answer the only
# question that matters here: does this photograph work through an elliptical
# arch, under a cobalt masthead, with a 60px serif headline over its lower
# half, on a limestone wall. A photograph can be beautiful and be wrong for
# that composition, and the reverse — and neither is visible in a provider's
# grid of rectangles. The sheet renders the actual homepage per candidate.
#
# THE HUMAN DECISION IS WHICH PHOTOGRAPH. Nothing here picks one. The previous
# design took a search result BY POSITION — "--pick 3" — so the picture a
# person approved and the picture that arrived could differ silently while
# every provenance field was correctly recorded about the wrong one.
#
# THE KEY IS A REPOSITORY SECRET AND IS PASSED AS `env` ON THE STEPS THAT NEED
# IT, never on a command line that gets logged, never into the register, never
# into the PR body. scripts/images/acquire.py does not print it and
# tools/checks.py greps the committed files for credential-shaped tokens.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "discover (search and list), acquire (one id) or batch (a list)"
        required: true
        type: choice
        options: [discover, acquire, batch]
        default: discover
      provider:
        description: "the acquisition provider — only ones the licence gate clears"
        required: true
        type: choice
        options: [pexels]
        default: pexels
      purpose:
        # NOT REQUIRED, BECAUSE A BATCH CARRIES ITS PURPOSES INSIDE `batch`.
        # A required input a caller must fill with a placeholder is a field
        # that teaches the caller to send nonsense; discover and acquire
        # refuse a missing one themselves, in their own words.
        description: "the surface, from data/image-purposes.json. DISCOVER takes a comma-separated list. Not used by BATCH"
        required: false
        type: string
      query:
        description: "discover only: what to search for — one, or one per purpose, comma-separated"
        required: false
        type: string
      photo_id:
        description: "acquire only: the EXACT provider photo id you approved"
        required: false
        type: string
      alt:
        description: "acquire only: what the photograph shows, for somebody who cannot see it"
        required: false
        type: string
      focal:
        description: "acquire only: focal point as x,y percentages"
        required: false
        default: "50,50"
        type: string
      batch:
        description: "batch only: JSON array of {purpose, photo_id, alt}"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    if: ${{ inputs.stage == 'discover' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # WHICH SECRETS CAN THIS WORKFLOW ACTUALLY SEE?
      #
      # Run #3 failed with "PEXELS_API_KEY is not set" one hour after the key
      # was added, and the log showed GitHub had substituted an empty string:
      # `PEXELS_API_KEY:` with nothing after it. The refusal was correct and
      # it could not say WHY, because a workflow cannot tell a misspelled
      # secret from an absent one — both arrive as "".
      #
      # This prints the NAMES only, never a value: it reads them out of an
      # env var rather than interpolating into the script, so nothing about
      # any secret reaches the log but the fact that it exists. A name that
      # is missing here is a name that was saved somewhere else — under
      # Variables rather than Secrets, on an Environment rather than the
      # repository, on another repository, or spelled differently.
      - name: Which secret names are visible here
        env:
          NAMES: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'EOF'
          import json, os
          names = sorted(json.loads(os.environ["NAMES"]))
          print("secrets this workflow can see:", ", ".join(names) or "(none)")
          if "PEXELS_API_KEY" not in names:
              print()
              print("PEXELS_API_KEY IS NOT AMONG THEM. It has to be a")
              print("REPOSITORY secret on this repository, under")
              print("Settings -> Secrets and variables -> Actions ->")
              print("Repository secrets, named exactly PEXELS_API_KEY.")
              print("A Variable is a different tab and an Environment")
              print("secret is a different scope; neither reaches this.")
          EOF

      # ONE DISPATCH FOR A SET OF SURFACES, BECAUSE THEY ARE ONE DECISION.
      # The ways-in band is four panels and a person judging it is judging
      # the STRIP, not four unrelated pictures — four dispatches, four waits
      # and four separate artifacts is a worse way to make one choice. Each
      # purpose still gets its own search, its own manifest and its own
      # sheets: this batches the RUN, never the acquisition, which stays one
      # approved id at a time with one provenance record behind it.
      - name: Refuse a dispatch with nothing to search for
        run: |
          test -n "${{ inputs.purpose }}" || {
            echo "purpose is required for discover — one, or several separated by commas"
            exit 1; }

      - name: Search and list candidates
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PURPOSES: ${{ inputs.purpose }}
          QUERIES: ${{ inputs.query }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/plan.txt
          import os
          ps = [p.strip() for p in os.environ["PURPOSES"].split(",") if p.strip()]
          qs = [q.strip() for q in os.environ.get("QUERIES", "").split(",")]
          qs = [q for q in qs if q]
          if len(qs) not in (0, 1, len(ps)):
              raise SystemExit(
                  f"{len(ps)} purposes and {len(qs)} queries. Give one query "
                  f"for all of them, or one each, in the same order.")
          for i, p in enumerate(ps):
              q = "" if not qs else (qs[0] if len(qs) == 1 else qs[i])
              print(f"{p}\t{q}")
          PY
          cat /tmp/plan.txt
          while IFS=$'\t' read -r purpose query; do
            echo "── $purpose ── $query"
            python3 scripts/images/discover.py \
              --provider "${{ inputs.provider }}" \
              --purpose "$purpose" \
              --query "$query" \
              --manifest "/tmp/candidates-$purpose.json"
          done < /tmp/plan.txt

      # THE SHEET IS THE POINT OF THIS STAGE, so it is not optional and it is
      # not a second dispatch. Discovery that ends at a list of ids hands the
      # art direction back to a provider's thumbnail grid, which is a
      # different composition than this site's.
      - name: Draw every candidate inside the real page
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          # No Pillow here on purpose. The sheet re-encodes nothing: it fetches
          # one preview per candidate and hands it to the browser, and the
          # build it needs is the ordinary stdlib one. Installing an image
          # library for a step that does not decode an image is how a
          # dependency arrives without a reason.
          python3 tools/build.py
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium
          # The suites launch the sandbox's own Chromium by path; a runner
          # has none, so the sheet takes the one Playwright just installed.
          HERO_SHEET_EXE="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          export HERO_SHEET_EXE
          mkdir -p /tmp/sheets
          # ONE SCRATCH DIRECTORY PER PURPOSE. `HERO_SHEET_DIR` was already
          # the seam — the renderer has never known where its manifest comes
          # from — so a set of surfaces needs no change to either script.
          while IFS=$'\t' read -r purpose query; do
            out=".cache/contact-$purpose"
            python3 scripts/images/contact_sheet.py \
              --manifest "/tmp/candidates-$purpose.json" --out "$out"
            HERO_SHEET_DIR="$out" node tools/hero-sheet.js "/tmp/sheets/$purpose.png"
            HERO_SHEET_DIR="$out" node tools/hero-sheet.js "/tmp/sheets/$purpose-phone.png" --phone
            HERO_SHEET_DIR="$out" node tools/hero-sheet.js "/tmp/sheets/$purpose-dark.png" --dark
            cp "/tmp/candidates-$purpose.json" /tmp/sheets/
          done < /tmp/plan.txt

      # NEVER A COMMIT. These are somebody else's photographs with no register
      # row, no hash and no date — the exact thing the licence gate refuses —
      # so they leave as an artifact of the run and the repository never sees
      # one. checks.py asserts that from the other end.
      - name: Upload the contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: hero-contact-sheet
          path: /tmp/sheets
          retention-days: 14

      - name: What to do with it
        run: |
          echo "Download the artifact and LOOK at the sheets — three per purpose:"
          echo "wide, phone and the dark preference."
          echo "Nothing was chosen for you: the order is the provider's"
          echo "search order and position on the sheet means nothing."
          echo "Then run this workflow again with stage=acquire and the id."

  acquire:
    if: ${{ inputs.stage == 'acquire' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The dataset has to be valid before anything is added to it. The
      # LICENCE gate is not here — it lives inside acquire.py, which refuses
      # before it opens a socket, because that is the only place that can
      # refuse per provider AND per route. A step here that merely ran the
      # checks would look like a gate and gate nothing.
      - name: Validate the dataset
        run: python3 tools/build.py check

      - name: Refuse a dispatch that is missing what acquisition needs
        run: |
          set -euo pipefail
          test -n "${{ inputs.purpose }}"  || { echo "purpose is required for acquire"; exit 1; }
          test -n "${{ inputs.photo_id }}" || { echo "photo_id is required for acquire"; exit 1; }
          test -n "${{ inputs.alt }}"      || { echo "alt is required for acquire"; exit 1; }

      - name: Acquire the approved photograph
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/images/acquire.py \
            --provider "${{ inputs.provider }}" \
            --photo-id "${{ inputs.photo_id }}" \
            --purpose "${{ inputs.purpose }}" \
            --alt "${{ inputs.alt }}" \
            --focal "${{ inputs.focal }}"

      - name: Build the width ladder and complete the provenance
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow pillow-avif-plugin
          python3 scripts/images/derive.py "${{ inputs.purpose }}"

      - name: Rebuild
        run: |
          set -euo pipefail
          python3 tools/build.py check
          python3 tools/build.py

      - name: Let the invariant register move, and say what moved
        run: |
          set -euo pipefail
          if python3 tools/invariants.py --check; then
            echo "no invariant moved"
          else
            echo "── an invariant moved; rewriting the register ──"
            python3 tools/invariants.py --write
            git --no-pager diff --unified=0 -- docs/invariants.json \
              | grep -E '^[+-] ' || true
            python3 tools/invariants.py --check
          fi

      - name: Run every gate
        run: |
          set -euo pipefail
          python3 tools/checks.py
          python3 tools/section-audit.py --check
          python3 tools/ux-audit.py --check

      # AND IT RUNS BEFORE checks.py, NOT AFTER IT. `tools/checks.py` runs
      # the invariant register as one of its own checks, so a rewrite placed
      # after the gate step never executes — the run dies inside checks.py on
      # the very row the rewrite exists to move. THAT IS THE SAME ORDERING
      # MISTAKE THIS REPOSITORY ALREADY RECORDED ONCE, in the local desk,
      # in exactly these words: "the fix was in the right place and the wrong
      # order". It needs the site BUILT first, because the register measures
      # built output, which is why the build is now its own step above.
      #
      # THE INVARIANT REGISTER IS MEANT TO MOVE ON THE FIRST PHOTOGRAPH.
      #
      # `safety.img_tags` is recorded as zero with the reason written out —
      # "this moving is the signal that licensed imagery arrived" — so
      # `--check` fails BY DESIGN the moment an acquisition works, and a
      # workflow that stopped there could never acquire a first photograph at
      # all. The register's rule is not *never move*, it is that moving one
      # SILENTLY is not allowed, and `--write` in the same commit is the
      # deliberate act.
      #
      # The local desk has done this since it was built and the workflow had
      # no step for it: the first real batch acquired eight photographs,
      # derived them, registered them, rebuilt the site, passed all 95 static
      # checks — and then refused itself on the one row that moving proves it
      # worked. Every moved row is named in the log and in the commit.
      - name: Browser and design gates
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium
          node tools/browser-checks.js

      # THE SECOND LOOK, and it is the one that catches a page whose every
      # count is right. It shoots the built homepage at both widths and fails
      # on any request the page made that came back 4xx — which is exactly
      # how the derivatives were once registered, referenced and absent, with
      # the hero rendering as a hole and every gate green.
      - name: Shoot the finished page for review
        run: |
          set -euo pipefail
          HERO_SHEET_EXE="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          export HERO_SHEET_EXE
          node tools/hero-shot.js /tmp/hero-shot

      - name: Upload the rendered page
        uses: actions/upload-artifact@v4
        with:
          name: hero-shot
          path: |
            /tmp/hero-shot-wide.png
            /tmp/hero-shot-phone.png
          retention-days: 30

      - name: Refuse to commit anything credential-shaped
        run: python3 tools/photo-tests.py --committed-only

      - name: Commit and push a branch
        id: push
        run: |
          set -euo pipefail
          git config user.name "europedoor-photographs"
          git config user.email "noreply@europedoor.com"
          BRANCH="photo/${{ inputs.purpose }}-${{ inputs.photo_id }}"
          git checkout -b "$BRANCH"
          # `photographs` IS THE EVIDENCE AND IT WAS NOT BEING COMMITTED.
          # The untouched original is what "this file is the file that was
          # licensed" is checked against — checks.py re-hashes every
          # registered one on every build — so a pull request carrying the
          # register and not the bytes is a pull request that goes red the
          # moment it lands. The batch path listed it and this one did not,
          # which is what two implementations of one thing costs.
          git add assets/img data/images.json docs site photographs
          git commit -m "Photograph: ${{ inputs.purpose }} (${{ inputs.provider }} ${{ inputs.photo_id }})" \
                     -m "Acquired by GitHub Actions from an approved photo id. safety.img_tags leaves zero."
          git push -u origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # THE PR IS THE APPROVAL BOUNDARY, so it carries the evidence rather
      # than a file listing. Every figure below is read out of the register
      # the acquisition wrote — none of it is typed here, so the PR cannot
      # describe a photograph other than the one committed.
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/images/pr_body.py \
            --purpose "${{ inputs.purpose }}" \
            --branch "${{ steps.push.outputs.branch }}" > /tmp/pr-body.md
          TITLE="Photograph: ${{ inputs.purpose }} (${{ inputs.provider }} ${{ inputs.photo_id }})"
          BRANCH="${{ steps.push.outputs.branch }}"
          # THE BRANCH IS ALREADY PUSHED BY THE TIME THIS RUNS, so a
          # refusal here must not read as "the acquisition failed". The
          # repository setting "Allow GitHub Actions to create and approve
          # pull requests" is a hard block on GITHUB_TOKEN opening one,
          # independent of `pull-requests: write` in the permissions block
          # above — so a correctly configured workflow can do every piece of
          # real work and fall over on the last line. Everything is on the
          # branch either way, and the log says where.
          if ! gh pr create \
            --title "$TITLE" \
            --body-file /tmp/pr-body.md \
            --head "$BRANCH" \
            --base "${{ github.ref_name }}"; then
            echo
            echo "── THE PULL REQUEST WAS REFUSED AND THE WORK IS SAFE ──"
            echo "Everything acquired is on the branch: $BRANCH"
            echo "Open it by hand here:"
            echo "  https://github.com/${{ github.repository }}/compare/${{ github.ref_name }}...$BRANCH?expand=1"
            echo
            echo "The usual cause is Settings -> Actions -> General ->"
            echo "Workflow permissions -> 'Allow GitHub Actions to create and"
            echo "approve pull requests', which is a separate switch from the"
            echo "permissions this workflow requests."
            exit 1
          fi


      # ── AND THEN IT MERGES ITSELF ────────────────────────────────────
      #
      # THE PULL REQUEST IS STILL THE RECORD; IT IS NO LONGER THE QUEUE.
      # The brief asked for "review and merge the PR", and eleven runs later
      # the measured reality is that the review was the ONE step a person
      # still had to remember — and every check it was waiting behind had
      # already passed: fetch by the approved id, id verified, original kept
      # and hashed, ladder derived without upscaling, provenance complete,
      # every static gate, the browser and design gates, the credential
      # scan. The owner decided that is enough, which is a decision about
      # THEIR product and not one this workflow gets to keep making for them.
      #
      # WHAT IS LOST IS NAMED RATHER THAN GLOSSED. Nothing now looks at the
      # photograph inside the rendered page before it is live. Every gate
      # verifies provenance, dimensions, contrast, the crop arithmetic and
      # the licence; none can say whether a gondola is the right opening for
      # the Grand Tour. The art direction moved entirely to the basket,
      # where the editor ticks a candidate — which is where it always was for
      # the first look, and is now where it is for the only one.
      #
      # THE MERGE IS NEVER THE THING THAT REPORTS SUCCESS. It runs after
      # every gate, so it cannot reach a red run; and if the repository
      # refuses it — branch protection, a required review, a conflict — the
      # work is already pushed and the pull request is already open, so this
      # says so and leaves it for a person rather than failing a run that
      # did everything right. A refusal here is a queue, not a loss.
      - name: Merge it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          BRANCH="${{ steps.push.outputs.branch }}"
          if gh pr merge "$BRANCH" --merge --delete-branch; then
            echo "merged $BRANCH into ${{ github.ref_name }}"
            echo "europedoor.com updates on the next deployment."
          else
            echo
            echo "── THE MERGE WAS REFUSED AND NOTHING IS LOST ──"
            echo "Every photograph is acquired, registered, gated and pushed,"
            echo "and the pull request is open. Merge it by hand:"
            echo "  https://github.com/${{ github.repository }}/pulls"
            echo
            echo "The usual causes are a branch-protection rule requiring a"
            echo "review, or a conflict with ${{ github.ref_name }}."
          fi

  batch:
    if: ${{ inputs.stage == 'batch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate the dataset
        run: python3 tools/build.py check

      # THE PLAN IS READ AND REFUSED BEFORE A SOCKET OPENS. A batch that
      # stops halfway leaves a branch holding some of what was approved, and
      # a reviewer cannot tell the difference between "these six were chosen"
      # and "these six arrived before it broke". So the shape is checked
      # first: a JSON array, every entry carrying a purpose, a numeric id and
      # an alt, no purpose twice, and no more than the cap.
      - name: Read the plan
        env:
          BATCH: ${{ inputs.batch }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/plan.tsv
          import json, os, sys
          raw = os.environ.get("BATCH") or ""
          try:
              plan = json.loads(raw)
          except Exception as e:
              sys.exit(f"batch is not JSON: {e}")
          if not isinstance(plan, list) or not plan:
              sys.exit("batch must be a non-empty JSON array")
          # A CAP, BECAUSE A RUNAWAY BATCH IS A RUNAWAY DOWNLOAD — AND IT
          # IS READ, NEVER TYPED. This number is enforced in four places
          # and only this one is the gate. It was typed here and typed
          # again in the desk, and when the desk was raised to sixty this
          # copy stayed at thirty: run 22 gathered sixty photographs
          # across every family and died on the first step with "the cap
          # is 30", after the editor had already approved them. A cap the
          # editor's own screen contradicts is worse than a low cap. The
          # number is declared once in tools/desk-registry.py and
          # generated into desk/registry.json, which is committed and
          # fails CI when stale.
          cap = json.load(open("desk/registry.json"))["dispatch_cap"]
          if len(plan) > cap:
              sys.exit(f"{len(plan)} entries is more than one pull request "
                       f"should carry. The cap is {cap}.")
          seen = set()
          for i, e in enumerate(plan):
              if not isinstance(e, dict):
                  sys.exit(f"entry {i} is not an object")
              p, pid, alt = e.get("purpose"), str(e.get("photo_id", "")), e.get("alt")
              if not p or p in seen:
                  sys.exit(f"entry {i}: missing or repeated purpose {p!r}. "
                           f"One surface holds one photograph.")
              seen.add(p)
              if not pid.isdigit():
                  sys.exit(f"entry {i}: {pid!r} is not a photo id. An id is "
                           f"an identity; a position is not.")
              if not alt or not str(alt).strip():
                  sys.exit(f"entry {i}: no alt text. A photograph nobody can "
                           f"describe is a photograph nobody can use.")
              print(f"{p}\t{pid}\t{str(alt).strip()}")
          print(f"{len(plan)} approved photographs", file=sys.stderr)
          PY
          cat /tmp/plan.tsv

      # ONE AT A TIME, THROUGH THE SAME SCRIPT. acquire.py is by id and
      # asserts the id it got back; derive.py reads the untouched original
      # and refuses to upscale. Neither knows it is in a batch, which is what
      # makes the batch safe: there is no second implementation to get wrong.
      #
      # AND ONE REFUSED CANDIDATE NO LONGER DISCARDS THE SITTING. Run 23
      # acquired eighteen photographs, hashed them, derived their ladders and
      # completed their provenance — and threw every one away because the
      # nineteenth was a PNG. `set -e` ended the job and the branch was never
      # pushed.
      #
      # acquire.py exits 3 for a refusal that is about ONE candidate (it does
      # not suit the slot, its bytes cannot be sized, the served size is not
      # the declared one, the id already fills a surface) and 1 for anything
      # a next candidate would hit too (no key, a refused gate, a rate limit,
      # an id the provider swapped). Three is recorded and skipped; one stops
      # the run. The line is whether the next candidate could succeed.
      #
      # A SKIP IS NEVER SILENT: it is named here, in the step summary, and in
      # the pull request beside the photographs that did arrive, and the
      # surface it was for stays empty. And a sitting where NOTHING was
      # acquired fails, because "found nothing suitable" and "could not run"
      # must not look the same.
      - name: Acquire each approved photograph
        id: acquire
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -uo pipefail
          python3 -m pip install --quiet pillow pillow-avif-plugin
          bash scripts/images/batch.sh "${{ inputs.provider }}" \
               /tmp/plan.tsv /tmp/skipped.txt | tee /tmp/batch.log
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || exit "$rc"
          took=$(sed -n 's/^took=\([0-9]\{1,\}\)$/\1/p' /tmp/batch.log | tail -1)
          skips=$(sed -n 's/^skipped=\([0-9]\{1,\}\)$/\1/p' /tmp/batch.log | tail -1)
          # AN EMPTY COUNT IS NOT A ZERO COUNT. Without -e a failed read
          # leaves these blank, the commit message says "Photographs:
          # acquired" and the PR title with it — a number that is not the
          # set's own extent, arriving as no number at all.
          case "$took$skips" in
            ""|*[!0-9]*) echo "batch.sh printed no counts; see /tmp/batch.log"
                         exit 1 ;;
          esac
          echo "took=$took" >> "$GITHUB_OUTPUT"
          echo "skipped=$skips" >> "$GITHUB_OUTPUT"
          echo "### $took acquired, $skips skipped" >> "$GITHUB_STEP_SUMMARY"
          if [ "$skips" != 0 ]; then
            {
              echo
              echo "| surface | id | why |"
              echo "|---|---|---|"
              while IFS=$'\t' read -r pp ii ww; do
                echo "| \`$pp\` | $ii | $ww |"
              done < /tmp/skipped.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # EVERY GATE, ONCE, OVER THE FINISHED SET. Running them between
      # acquisitions would check thirteen half-built states and never the one
      # that ships.
      - name: Rebuild
        run: |
          set -euo pipefail
          python3 tools/build.py check
          python3 tools/build.py

      - name: Let the invariant register move, and say what moved
        run: |
          set -euo pipefail
          if python3 tools/invariants.py --check; then
            echo "no invariant moved"
          else
            echo "── an invariant moved; rewriting the register ──"
            python3 tools/invariants.py --write
            git --no-pager diff --unified=0 -- docs/invariants.json \
              | grep -E '^[+-] ' || true
            python3 tools/invariants.py --check
          fi

      - name: Run every gate
        run: |
          set -euo pipefail
          python3 tools/checks.py
          python3 tools/section-audit.py --check
          python3 tools/ux-audit.py --check

      # AND IT RUNS BEFORE checks.py, NOT AFTER IT. `tools/checks.py` runs
      # the invariant register as one of its own checks, so a rewrite placed
      # after the gate step never executes — the run dies inside checks.py on
      # the very row the rewrite exists to move. THAT IS THE SAME ORDERING
      # MISTAKE THIS REPOSITORY ALREADY RECORDED ONCE, in the local desk,
      # in exactly these words: "the fix was in the right place and the wrong
      # order". It needs the site BUILT first, because the register measures
      # built output, which is why the build is now its own step above.
      #
      # THE INVARIANT REGISTER IS MEANT TO MOVE ON THE FIRST PHOTOGRAPH.
      #
      # `safety.img_tags` is recorded as zero with the reason written out —
      # "this moving is the signal that licensed imagery arrived" — so
      # `--check` fails BY DESIGN the moment an acquisition works, and a
      # workflow that stopped there could never acquire a first photograph at
      # all. The register's rule is not *never move*, it is that moving one
      # SILENTLY is not allowed, and `--write` in the same commit is the
      # deliberate act.
      #
      # The local desk has done this since it was built and the workflow had
      # no step for it: the first real batch acquired eight photographs,
      # derived them, registered them, rebuilt the site, passed all 95 static
      # checks — and then refused itself on the one row that moving proves it
      # worked. Every moved row is named in the log and in the commit.
      - name: Browser and design gates
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium
          node tools/browser-checks.js

      - name: Refuse to commit anything credential-shaped
        run: python3 tools/photo-tests.py --committed-only

      - name: Commit and push a branch
        id: push
        run: |
          set -euo pipefail
          git config user.name "europedoor-photographs"
          git config user.email "noreply@europedoor.com"
          # WHAT ARRIVED, NOT WHAT WAS ASKED FOR. This counted the PLAN,
          # which was the same number until a batch could skip a candidate
          # — and a count that is not the set's own extent reads as one.
          N="${{ steps.acquire.outputs.took }}"
          SK="${{ steps.acquire.outputs.skipped }}"
          BRANCH="photo/batch-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add assets/img data/images.json docs site photographs
          {
            echo "Photographs: $N acquired from approved ids"
            echo
            echo "Acquired by GitHub Actions from ids approved in the Media Desk. Each fetched by id, hashed, derived without upscaling, and registered."
            if [ "$SK" != 0 ]; then
              echo
              echo "$SK approved candidates were refused and are named in the pull request. Those surfaces are still empty and nothing was substituted for them."
            fi
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push -u origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "count=$N" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # THE PURPOSES THAT ARRIVED, NOT THE PURPOSES THAT WERE ASKED
          # FOR. pr_body.py reads the register and refuses a purpose with no
          # row — correctly, because a PR describing nothing must not open —
          # so listing the whole plan would kill the step on the first skip.
          # The skipped ones go in as their own section, named.
          comm -23 <(cut -f1 /tmp/plan.tsv | sort) \
                   <(cut -f1 /tmp/skipped.txt | sort) > /tmp/took.txt
          PURPOSES=$(paste -sd, /tmp/took.txt)
          python3 scripts/images/pr_body.py \
            --purpose "$PURPOSES" \
            --skipped /tmp/skipped.txt \
            --branch "${{ steps.push.outputs.branch }}" > /tmp/pr-body.md
          TITLE="Photographs: ${{ steps.push.outputs.count }} acquired"
          BRANCH="${{ steps.push.outputs.branch }}"
          # THE BRANCH IS ALREADY PUSHED BY THE TIME THIS RUNS, so a
          # refusal here must not read as "the acquisition failed". The
          # repository setting "Allow GitHub Actions to create and approve
          # pull requests" is a hard block on GITHUB_TOKEN opening one,
          # independent of `pull-requests: write` in the permissions block
          # above — so a correctly configured workflow can do every piece of
          # real work and fall over on the last line. Everything is on the
          # branch either way, and the log says where.
          if ! gh pr create \
            --title "$TITLE" \
            --body-file /tmp/pr-body.md \
            --head "$BRANCH" \
            --base "${{ github.ref_name }}"; then
            echo
            echo "── THE PULL REQUEST WAS REFUSED AND THE WORK IS SAFE ──"
            echo "Everything acquired is on the branch: $BRANCH"
            echo "Open it by hand here:"
            echo "  https://github.com/${{ github.repository }}/compare/${{ github.ref_name }}...$BRANCH?expand=1"
            echo
            echo "The usual cause is Settings -> Actions -> General ->"
            echo "Workflow permissions -> 'Allow GitHub Actions to create and"
            echo "approve pull requests', which is a separate switch from the"
            echo "permissions this workflow requests."
            exit 1
          fi

      # ── AND THEN IT MERGES ITSELF ────────────────────────────────────
      #
      # THE PULL REQUEST IS STILL THE RECORD; IT IS NO LONGER THE QUEUE.
      # The brief asked for "review and merge the PR", and eleven runs later
      # the measured reality is that the review was the ONE step a person
      # still had to remember — and every check it was waiting behind had
      # already passed: fetch by the approved id, id verified, original kept
      # and hashed, ladder derived without upscaling, provenance complete,
      # every static gate, the browser and design gates, the credential
      # scan. The owner decided that is enough, which is a decision about
      # THEIR product and not one this workflow gets to keep making for them.
      #
      # WHAT IS LOST IS NAMED RATHER THAN GLOSSED. Nothing now looks at the
      # photograph inside the rendered page before it is live. Every gate
      # verifies provenance, dimensions, contrast, the crop arithmetic and
      # the licence; none can say whether a gondola is the right opening for
      # the Grand Tour. The art direction moved entirely to the basket,
      # where the editor ticks a candidate — which is where it always was for
      # the first look, and is now where it is for the only one.
      #
      # THE MERGE IS NEVER THE THING THAT REPORTS SUCCESS. It runs after
      # every gate, so it cannot reach a red run; and if the repository
      # refuses it — branch protection, a required review, a conflict — the
      # work is already pushed and the pull request is already open, so this
      # says so and leaves it for a person rather than failing a run that
      # did everything right. A refusal here is a queue, not a loss.
      - name: Merge it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          BRANCH="${{ steps.push.outputs.branch }}"
          if gh pr merge "$BRANCH" --merge --delete-branch; then
            echo "merged $BRANCH into ${{ github.ref_name }}"
            echo "europedoor.com updates on the next deployment."
          else
            echo
            echo "── THE MERGE WAS REFUSED AND NOTHING IS LOST ──"
            echo "Every photograph is acquired, registered, gated and pushed,"
            echo "and the pull request is open. Merge it by hand:"
            echo "  https://github.com/${{ github.repository }}/pulls"
            echo
            echo "The usual causes are a branch-protection rule requiring a"
            echo "review, or a conflict with ${{ github.ref_name }}."
          fi
