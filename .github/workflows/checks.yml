name: checks

# The generated site is committed, so the first thing CI does is rebuild it
# and fail if the result differs from what is in the repository. Everything
# else is downstream of that: a stale site/ means the checks below are
# validating output nobody is going to serve.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate the dataset
        run: python3 tools/build.py check

      - name: Rebuild the site
        run: python3 tools/build.py

      - name: Fail if the social-card cache is stale
        run: |
          if ! git diff --quiet -- assets/og/; then
            echo "assets/og/ is out of date. Run: python3 tools/build.py && git add assets/og/"
            git diff --stat -- assets/og/
            exit 1
          fi

      - name: Fail if the committed site is stale
        run: |
          if ! git diff --quiet -- site/; then
            echo "site/ is out of date. Run: python3 tools/build.py && git add site/"
            git diff --stat -- site/
            exit 1
          fi

      - name: Checks
        run: python3 tools/checks.py

      # WHAT A VISUAL CHANGE MAY NOT MOVE. `invariants.py` was run by hand
      # and by nothing else, which makes it a gate that holds only while
      # somebody remembers it — and the register's whole point is that
      # moving a row silently is not allowed.
      - name: The invariant register
        run: python3 tools/invariants.py --check

      # THE MEDIA DESK, BOTH HALVES. Neither suite acquires, neither reaches
      # a provider, and the local one asserts that the register and the
      # working tree are untouched by its own run — which is why they can sit
      # here, before the staleness checks would notice a rebuild.
      - name: The Media Desk — the local boundary
        run: python3 tools/desk-tests.py

      - name: Audit the brief, section by section
        run: python3 tools/section-audit.py --check

      - name: Fail if the content report is stale
        run: |
          python3 tools/content-report.py --write
          if ! git diff --quiet -- docs/content-report.md; then
            echo "docs/content-report.md is out of date. Run: python3 tools/content-report.py --write"
            git diff -- docs/content-report.md
            exit 1
          fi

      - name: Fail if the audit document is stale
        run: |
          python3 tools/section-audit.py --write
          if ! git diff --quiet -- docs/section-audit.md; then
            echo "docs/section-audit.md is out of date. Run: python3 tools/section-audit.py --write"
            git diff -- docs/section-audit.md
            exit 1
          fi

      - name: Fail if the roadmap or the audit went stale
        run: |
          test -s docs/audit-2026-09.md
          test -s docs/roadmap.md

      - name: Audit the UI/UX brief, section by section
        run: python3 tools/ux-audit.py --check

      - name: Fail if the UX audit document is stale
        run: |
          python3 tools/ux-audit.py --write
          if ! git diff --quiet -- docs/ux-audit.md; then
            echo "docs/ux-audit.md is out of date. Run: python3 tools/ux-audit.py --write"
            git diff -- docs/ux-audit.md
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: The Media Desk — the hosted boundary
        run: node tools/hosted-desk-tests.js

      - name: Browser checks
        run: |
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium
          node tools/browser-checks.js
